[package]
name = "mdp2p-node"
version = "0.1.0"
description = "MDP2P peer: naming client, DHT discovery, verified bundle download and seeding over rust-libp2p"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdp2p-core = { path = "../mdp2p-core" }
anyhow = "1"
futures = "0.3"
libp2p = { version = "0.57", features = ["tokio", "tcp", "noise", "yamux", "kad", "identify", "ping", "request-response", "macros", "ed25519"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
