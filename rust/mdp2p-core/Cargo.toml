[package]
name = "mdp2p-core"
version = "0.1.0"
description = "MDP2P protocol core: canonical JSON, signature checks, bundle acceptance, key pinning"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
