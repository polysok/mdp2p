name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests + vectors
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (fastecdsa needs GMP)
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - run: pip install -e ".[dev]"
      - name: Vectors are up to date with the reference
        run: python scripts/gen_vectors.py --check
      - run: pytest tests/ -q

  rust:
    name: Rust core (vectors, clippy, wasm)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Builds for the browser extension target
        run: cargo build -p mdp2p-core --target wasm32-unknown-unknown --release
